name: AETHRION validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax across the repository
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
      - name: Check required JARVIS and policy files
        run: |
          test -s aethrion-jarvis.html
          test -s aethrion-jarvis.css
          test -s docs/AETHRION-ECOSYSTEM-JARVIS.md
          test -s docs/ROLE-ACCESS-MATRIX.md
          test -s docs/RELEASE-AND-REGRESSION-CHECKLIST.md
          test -s aethrion-project-audit.html
          test -s aethrion-status.html
          test -s aethrion-audit-icon.svg
          test -s aethrion-status-icon.svg
          test -s docs/AETHRION-AUDIT-DIAGNOSTICS.md
