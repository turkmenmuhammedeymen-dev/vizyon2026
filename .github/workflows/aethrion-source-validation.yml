name: AETHRION source validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-auth-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Back4App Cloud Code syntax
        run: node --check back4app/main.js
      - name: Check unified frontend JavaScript syntax
        run: node --check app.js
      - name: Verify canonical Back4App client configuration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const app = fs.readFileSync('app.js', 'utf8');
          const expectedAppId = 'Dr9SODgMburZ54QvC8RnIHc9dbjreozBbKLOpMjX';
          const expectedJsKey = 'dCXRvnEcCcOFvpzVDAV9AAJnYvdrqaP1JFRkJzvv';
          const appIdAssignments = [...app.matchAll(/APPLICATION_ID\\s*=\\s*['"]([^'"]+)['"]/g)].map(m => m[1]);
          const keyAssignments = [...app.matchAll(/JAVASCRIPT_KEY\\s*=\\s*['"]([^'"]+)['"]/g)].map(m => m[1]);
          if (appIdAssignments.length !== 1 || appIdAssignments[0] !== expectedAppId) {
            throw new Error('app.js must contain exactly one canonical Back4App Application ID.');
          }
          if (keyAssignments.length !== 1 || keyAssignments[0] !== expectedJsKey) {
            throw new Error('app.js must contain exactly one canonical Back4App JavaScript key.');
          }
          const roots = ['.'];
          const mismatches = [];
          while (roots.length) {
            const current = roots.pop();
            for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
              const full = path.join(current, entry.name);
              if (entry.isDirectory()) {
                if (!['.git', 'node_modules', '.vercel'].includes(entry.name)) roots.push(full);
                continue;
              }
              try {
                const content = fs.readFileSync(full, 'utf8');
                const calls = /Parse\\.initialize\\s*\\(\\s*["']([^"']+)["']\\s*,\\s*["']([^"']+)["']/g;
                let match;
                while ((match = calls.exec(content)) !== null) {
                  if (match[1] !== expectedAppId || match[2] !== expectedJsKey) {
                    mismatches.push(full + ' has a non-canonical Parse.initialize pair');
                  }
                }
              } catch (_) {}
            }
          }
          if (mismatches.length) throw new Error(mismatches.join('\\n'));
          console.log('Canonical Back4App IDs verified in app.js and every literal Parse.initialize call.');
          NODE
      - name: Check every inline JavaScript block in index.html
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('index.html', 'utf8');
          const scriptRe = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let match;
          let checked = 0;
          const errors = [];
          while ((match = scriptRe.exec(html)) !== null) {
            const attrs = match[1] || '';
            const code = match[2] || '';
            if (/\bsrc\s*=/.test(attrs)) continue;
            if (/\btype\s*=\s*["']application\/ld\+json["']/i.test(attrs)) continue;
            if (!code.trim()) continue;
            checked++;
            const file = path.join(os.tmpdir(), 'aethrion-inline-' + checked + '.js');
            fs.writeFileSync(file, code, 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              errors.push('Inline script #' + checked + ' near HTML byte ' + match.index + '\n' +
                (result.stderr || result.stdout || 'node --check failed'));
            }
            fs.rmSync(file, { force: true });
          }
          console.log('Checked ' + checked + ' inline JavaScript blocks.');
          if (errors.length) {
            console.error(errors.join('\n\n'));
            process.exit(1);
          }
          const required = [
            'id="rName"', 'id="rEmail"', 'id="rUsername"', 'id="rPass"', 'id="rPass2"',
            'id="registerTermsCheck"', 'id="registerPrivacyCheck"',
            'id="lEmail"', 'id="lPass"', 'id="loginTermsCheck"', 'id="loginPrivacyCheck"',
            'window.__aethrionSafeAuthAction(\'register\', this)',
            'window.__aethrionSafeAuthAction(\'login\', this)',
          ];
          const app = fs.readFileSync('app.js', 'utf8');
          const requiredApp = [
            'global.handleRegister = async function',
            'global.handleLogin = async function',
            'global.verifyAccount = async function',
            'global.resendAccountVerification = async function',
            'resendAccountVerification',
            'verifyUser'
          ];
          const missingApp = requiredApp.filter(value => !app.includes(value));
          if (missingApp.length) {
            console.error('Missing frontend authentication handlers: ' + missingApp.join(', '));
            process.exit(1);
          }
          const missing = required.filter(value => !html.includes(value));
          if (missing.length) {
            console.error('Missing authentication wiring: ' + missing.join(', '));
            process.exit(1);
          }
          if (html.indexOf('AETHRION auth click guard:') > html.lastIndexOf('</body>')) {
            console.error('Authentication click guard must be inside the document body.');
            process.exit(1);
          }
          console.log('Authentication form wiring checks passed.');
          NODE
