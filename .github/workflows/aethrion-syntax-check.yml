name: AETHRION syntax checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: Browser and Back4App JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse all AETHRION runtime files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app.js aethrion-*.js back4app/main.js)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No AETHRION JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Checking ${file}"
            node --check "${file}"
          done
