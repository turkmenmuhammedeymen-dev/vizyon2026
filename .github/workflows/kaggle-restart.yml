name: Kaggle Otomatik Yeniden Başlatma

on:
  schedule:
    # Her 11 saatte bir çalışır (UTC)
    - cron: '0 */11 * * *'
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  restart-kaggle:
    runs-on: ubuntu-latest
    
    steps:
    - name: Kaggle CLI Kur
      run: pip install kaggle
    
    - name: Kaggle API Ayarları
      run: |
        mkdir -p ~/.kaggle
        echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
        chmod 600 ~/.kaggle/kaggle.json
    
    - name: Kaggle Notebook'u Yeniden Çalıştır
      run: |
        echo "Kaggle notebook yeniden başlatılıyor..."
        # Notebook'un mevcut versiyonunu çalıştır
        kaggle kernels status KULLANICI_ADIN/NOTEBOOK_ADIN
        # Yeni versiyon oluştur
        kaggle kernels push -p ./kaggle-notebook
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      continue-on-error: true
    
    - name: 30 Saniye Bekle (Yeni Tünel Açılsın)
      run: sleep 30
    
    - name: Tünel URL'sini Kontrol Et ve SashiDo'yu Güncelle
      run: |
        echo "SashiDo config güncelleniyor..."
        # Bu adımda manuel olarak URL'yi kontrol etmen gerekebilir
        # Otomatik almak için Kaggle output'unu okumak gerekir
      env:
        SASHIDO_MASTER_KEY: ${{ secrets.SASHIDO_MASTER_KEY }}
