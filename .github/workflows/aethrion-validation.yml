name: AETHRION security and legal validation
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check homepage and auth runtime JavaScript
        run: |
          set -euo pipefail
          for file in app.js aethrion-core.js aethrion-home-workspace.js aethrion-interaction-recovery.js aethrion-auth-hotfix.js aethrion-social-auth.js aethrion-ui-runtime.js aethrion-schema.js; do
            test -s "$file" || { echo "Missing or empty runtime file: $file"; exit 1; }
            node --check "$file"
          done
      - name: Check homepage workspace routes and local assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'aethrion-core.js',
            'app.js',
            'aethrion-home-workspace.js',
            'aethrion-coach.js',
            'aethrion-market-contest.js',
            'aethrion-interaction-recovery.js',
            'aethrion-auth-hotfix.js',
            'aethrion-social-auth.js',
            'aethrion-ui-runtime.js',
            'aethrion-ai.html',
            'aethrion-assistant.html'
          ];
          const failures = [];
          for (const file of required) {
            if (!fs.existsSync(file)) failures.push('Missing required file: ' + file);
          }
          for (const file of required.filter(x => x.endsWith('.js'))) {
            if (!html.includes(file)) failures.push('index.html does not load ' + file);
          }
          const localRefs = new Set();
          for (const match of html.matchAll(/(?:src|href)=[\"']([^\"']+)[\"']/gi)) {
            const raw = match[1];
            if (raw.startsWith('http:') || raw.startsWith('https:') || raw.startsWith('//') || raw.startsWith('#') || raw.startsWith('data:') || raw.startsWith('mailto:')) continue;
            const path = raw.startsWith('./') ? raw.slice(2) : (raw.startsWith('/') ? raw.slice(1) : raw);
            if (['.js','.css','.html','.svg','.png','.webp','.ico','.json','.woff','.woff2'].some(ext => path.toLowerCase().split('?')[0].endsWith(ext))) localRefs.add(path.split('?')[0]);
          }
          if (!html.includes('aethrion-home-workspace.js?v=')) failures.push('Workspace launcher cache version missing');
          if (!html.includes('aethrion-interaction-recovery.js?v=')) failures.push('Interaction recovery cache version missing');
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Homepage assets and workspace routes passed static checks (' + localRefs.size + ' local references).');
          NODE
      - name: Check AI chat routing and daily quota wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const home = fs.readFileSync('index.html', 'utf8');
          const router = fs.readFileSync('aethrion-home-workspace.js', 'utf8');
          const recovery = fs.readFileSync('aethrion-interaction-recovery.js', 'utf8');
          const cloud = fs.readFileSync('back4app/main.js', 'utf8');
          const checks = [
            [home.includes('id="vizyonAlPanel"'), 'Legacy 28-model chat panel is missing'],
            [router.includes("w.openFullAIPanel = function () {") && router.includes("showChat('ai')"), 'Primary AI button is not routed to the legacy chat'],
            [fs.readFileSync('aethrion-coach.js', 'utf8').includes("cloud('kocChat'") && fs.readFileSync('aethrion-coach.js', 'utf8').includes("cloud('getKocHistory'") && fs.readFileSync('aethrion-coach.js', 'utf8').includes("cloud('shareKocConversation'"), 'AETHRION Coach chat, history, or share integration is missing'],
            [fs.readFileSync('aethrion-market-contest.js', 'utf8').includes("cloud('getMarketProjects'") && fs.readFileSync('aethrion-market-contest.js', 'utf8').includes("cloud('getActiveContest'") && fs.readFileSync('aethrion-market-contest.js', 'utf8').includes("cloud('createContestProject'"), 'Points market or monthly contest integration is missing'],
            [fs.readFileSync('app.js', 'utf8').includes('function renderHomeCatalog(w)') && fs.readFileSync('app.js', 'utf8').includes('aewHomeCatalog'), 'Full feature catalogue is missing from the workspace home'],
            [fs.readFileSync('aethrion-teams.html', 'utf8').includes('id="teamChatGif"') && fs.readFileSync('aethrion-teams.js', 'utf8').includes('function openTeamGifPicker') && fs.readFileSync('aethrion-core.js', 'utf8').includes('w.openGifPicker=function()'), 'Team chat GIF picker is not wired into the Team workspace'],
            [cloud.includes('Parse.Cloud.define("searchGif"'), 'GIF search Cloud Function is missing'],
            [recovery.includes("w.Parse.Cloud.run('aethrionChat'"), 'Chat UI does not call the quota-aware backend endpoint'],
            [recovery.includes("w.openModal = function (id)"), 'Auth modal wrapper is missing'],
            [cloud.includes('Parse.Cloud.define("aethrionChat"'), 'Daily-quota chat endpoint is missing'],
            [cloud.includes('Parse.Cloud.define("getAethrionAIQuota"'), 'Daily-quota status endpoint is missing']
          ];
          const failures = checks.filter(x => !x[0]).map(x => x[1]);
          if (failures.length) { console.error(failures.join('\n')); process.exit(1); }
          console.log('AI chat routing, auth modal recovery, and daily quota wiring passed.');
          NODE
      - name: Check Back4App Cloud Code
        run: node --check back4app/main.js
      - name: Check browser security guard
        run: node --check aethrion-security-guard.js
      - name: Check workspace navigation
        run: node --check aethrion-workspace-v5.js && node --check aethrion-workspace-v6.js
      - name: Check required policy pages
        shell: bash
        run: |
          set -euo pipefail
          for file in ai-kullanim-politikasi.html api-belgelendirme.html api-kullanim-kosullari.html cerez-politikasi.html gizlilik.html guvenlik-politikasi.html hesap-ve-oturum-guvenligi.html kabul-edilebilir-kullanim.html kullanici-sozlesmesi.html kvkk-aydinlatma.html ucuncu-taraf-hizmetler.html veri-saklama-silme-politikasi.html; do
            test -s "$file" || { echo "Missing or empty policy file: $file"; exit 1; }
          done
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' gizlilik.html
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' guvenlik-politikasi.html
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' kullanici-sozlesmesi.html
