name: AETHRION security and legal validation
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check homepage and auth runtime JavaScript
        run: |
          set -euo pipefail
          for file in app.js aethrion-core.js aethrion-home-workspace.js aethrion-auth-hotfix.js aethrion-social-auth.js aethrion-ui-runtime.js aethrion-schema.js; do
            test -s "$file" || { echo "Missing or empty runtime file: $file"; exit 1; }
            node --check "$file"
          done
      - name: Check homepage workspace routes and local assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            'aethrion-core.js',
            'app.js',
            'aethrion-home-workspace.js',
            'aethrion-auth-hotfix.js',
            'aethrion-social-auth.js',
            'aethrion-ui-runtime.js',
            'aethrion-ai.html',
            'aethrion-assistant.html'
          ];
          const failures = [];
          for (const file of required) {
            if (!fs.existsSync(file)) failures.push('Missing required file: ' + file);
          }
          for (const file of required.filter(x => x.endsWith('.js'))) {
            if (!html.includes('/' + file)) failures.push('index.html does not load /' + file);
          }
          if (!html.includes('aethrion-home-workspace.js?v=')) failures.push('Workspace launcher cache version missing');
          if (failures.length) {
            console.error(failures.join('\\n'));
            process.exit(1);
          }
          console.log('Homepage assets and workspace routes passed static checks.');
          NODE
      - name: Check Back4App Cloud Code
        run: node --check back4app/main.js
      - name: Check browser security guard
        run: node --check aethrion-security-guard.js
      - name: Check workspace navigation
        run: node --check aethrion-workspace-v5.js && node --check aethrion-workspace-v6.js
      - name: Check required policy pages
        shell: bash
        run: |
          set -euo pipefail
          for file in ai-kullanim-politikasi.html api-belgelendirme.html api-kullanim-kosullari.html cerez-politikasi.html gizlilik.html guvenlik-politikasi.html hesap-ve-oturum-guvenligi.html kabul-edilebilir-kullanim.html kullanici-sozlesmesi.html kvkk-aydinlatma.html ucuncu-taraf-hizmetler.html veri-saklama-silme-politikasi.html; do
            test -s "$file" || { echo "Missing or empty policy file: $file"; exit 1; }
          done
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' gizlilik.html
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' guvenlik-politikasi.html
          grep -Eiq 'IPQS|IPQualityScore|VPN|proxy|Tor' kullanici-sozlesmesi.html
