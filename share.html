<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paylaşılan Sohbet | VİZYON 2027</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Syne:wght@400;600;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #050a0f;
            color: #ccdeee;
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        a {
            color: #00d4ff;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #a855f7;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(13, 26, 38, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.12);
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 12px 60px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.12);
            margin-bottom: 30px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #00d4ff, #a855f7, #ff6b35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(45deg, #00d4ff, #a855f7, #ff6b35, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 4s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .back-link {
            font-size: 14px;
            font-weight: 600;
            padding: 8px 20px;
            border: 1px solid #00d4ff;
            border-radius: 40px;
            color: #00d4ff;
            background: transparent;
            transition: all 0.25s;
            cursor: pointer;
        }
        .back-link:hover {
            background: rgba(0, 212, 255, 0.12);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.2);
            transform: scale(1.02);
        }
        .chat-title {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .chat-subtitle {
            font-size: 14px;
            color: #8ab4cc;
            margin-bottom: 24px;
        }
        .chat-subtitle i {
            color: #00d4ff;
        }
        .messages-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }

        /* === MESAJ KUTULARI === */
        .message-item {
            display: flex;
            flex-direction: column;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 85%;
            word-break: break-word;
            white-space: pre-wrap;
            transition: background 0.2s;
        }
        .message-item.own {
            align-self: flex-end;
            background: rgba(0, 212, 255, 0.12);
            border-left: 3px solid #00d4ff;
            border-radius: 16px 16px 4px 16px;
        }
        .message-item.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px 16px 16px 4px;
        }
        .message-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .message-sender {
            font-weight: 600;
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .message-sender .time {
            font-weight: 400;
            color: #5a7a8a;
            font-size: 11px;
            margin-left: 10px;
        }
        .message-text {
            font-size: 15px;
            color: #e8f0f8;
        }
        .message-file {
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 20px;
            font-size: 13px;
            color: #00d4ff;
            transition: background 0.2s;
            width: fit-content;
        }
        .message-file:hover {
            background: rgba(0, 212, 255, 0.15);
        }
        .message-file a {
            color: #00d4ff;
        }
        .message-file a:hover {
            color: #a855f7;
        }
        .message-image {
            margin-top: 6px;
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.15);
        }
        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #8ab4cc;
            font-size: 16px;
        }
        .loading-state .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 212, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: #ff6b6b;
            font-size: 16px;
        }
        .error-state i {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }
        .page-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.08);
            text-align: center;
            color: #5a7a8a;
            font-size: 13px;
        }
        .page-footer a {
            color: #00d4ff;
        }
        .page-footer a:hover {
            color: #a855f7;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 12px;
            }
            .container {
                padding: 24px 18px;
                border-radius: 20px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            .logo-text {
                font-size: 18px;
            }
            .chat-title {
                font-size: 20px;
            }
            .message-item {
                padding: 10px 14px;
                max-width: 95%;
            }
            .message-text {
                font-size: 14px;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }
            .container {
                padding: 16px 12px;
                border-radius: 16px;
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            .logo-text {
                font-size: 16px;
            }
            .back-link {
                font-size: 12px;
                padding: 6px 14px;
            }
            .chat-title {
                font-size: 18px;
            }
            .chat-subtitle {
                font-size: 12px;
            }
            .message-item {
                padding: 8px 12px;
                max-width: 98%;
            }
            .message-sender {
                font-size: 13px;
            }
            .message-text {
                font-size: 13px;
            }
            .message-file {
                font-size: 12px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">

        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">💬</div>
                <div class="logo-text">VİZYON 2027</div>
            </div>
            <a href="https://vizyon2026.vercel.app/" class="back-link">
                <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
            </a>
        </header>

        <div id="content">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div>Sohbet yükleniyor...</div>
            </div>
            <div class="error-state" id="errorState" style="display:none;">
                <i class="fas fa-exclamation-circle"></i>
                <div id="errorMessage">Sohbet bulunamadı.</div>
            </div>
            <div id="chatContent" style="display:none;">
                <div class="chat-title" id="chatTitle">Paylaşılan Sohbet</div>
                <div class="chat-subtitle">
                    <i class="fas fa-lock" style="margin-right:4px;"></i> Salt okunur ·
                    <span id="messageCount">0</span> mesaj
                </div>
                <div class="messages-container" id="messagesContainer"></div>
            </div>
        </div>

        <footer class="page-footer">
            <p>
                © 2027 <strong>Vizyon2027</strong> ·
                <a href="https://vizyon2026.vercel.app/gizlilik.html" target="_blank">Gizlilik Politikası</a> ·
                <a href="https://vizyon2026.vercel.app/kullanici-sozlesmesi.html" target="_blank">Kullanıcı Sözleşmesi</a>
            </p>
        </footer>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/parse/5.0.0/parse.min.js"></script>
    <script>
        // ================================================================
        // PAYLAŞILAN SOHBET SAYFASI – VİZYON 2027
        // ================================================================

        Parse.initialize(
            "ThIYRKlEASe177ioNjJX37easF7lVvlzWiZrGuK8",
            "mur4DtLsGOsQhykTnFVNGxYOeNbvjPbAkl6xPQGp"
        );
        Parse.serverURL = "https://parseapi.back4app.com";

        function getShareId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleString('tr-TR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ---- Kullanıcı adını güvenli göster ----
        function getDisplayName(user) {
            if (!user) return 'Kullanıcı';
            return user.name || user.username || user.email || 'Kullanıcı';
        }

        async function loadSharedConversation() {
            const shareId = getShareId();
            const loadingEl = document.getElementById('loadingState');
            const errorEl = document.getElementById('errorState');
            const errorMsg = document.getElementById('errorMessage');
            const chatEl = document.getElementById('chatContent');
            const titleEl = document.getElementById('chatTitle');
            const countEl = document.getElementById('messageCount');
            const container = document.getElementById('messagesContainer');

            if (!shareId) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorMsg.textContent = 'Geçersiz paylaşım bağlantısı. Paylaşım ID eksik.';
                return;
            }

            try {
                const result = await Parse.Cloud.run('getSharedConversation', { shareId: shareId });

                if (!result || !result.success || !result.messages) {
                    throw new Error(result?.message || 'Sohbet bulunamadı.');
                }

                loadingEl.style.display = 'none';
                errorEl.style.display = 'none';
                chatEl.style.display = 'block';

                titleEl.textContent = result.conversationName || 'Paylaşılan Sohbet';
                countEl.textContent = result.messages.length;

                if (result.messages.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:30px;color:#8ab4cc;">
                            <i class="fas fa-comment-slash" style="font-size:32px;display:block;margin-bottom:10px;"></i>
                            Bu sohbette henüz mesaj yok.
                        </div>
                    `;
                    return;
                }

                // ---- Mesajları render et ----
                let html = '';
                // currentUserId'yi al (eğer oturum açık değilse null)
                let currentUserId = null;
                try {
                    const user = Parse.User.current();
                    if (user) currentUserId = user.id;
                } catch (e) {}

                result.messages.forEach((msg) => {
                    const senderName = msg.name || 'Kullanıcı';
                    const text = msg.text || '';
                    const file = msg.file || null;
                    const fileName = msg.fileName || 'Dosya';
                    const time = msg.createdAt ? formatTime(msg.createdAt) : '';
                    const fromUserId = msg.from_user_id || null;

                    // Eğer mesajı gönderen kişi mevcut kullanıcıysa "own", değilse "other"
                    const isOwn = (currentUserId && fromUserId && fromUserId === currentUserId);

                    html += `<div class="message-item ${isOwn ? 'own' : 'other'}">`;
                    html += `<div class="message-sender">${senderName} <span class="time">${time}</span></div>`;
                    html += `<div class="message-text">${text}</div>`;

                    if (file) {
                        const isImage = file.match(/\.(jpeg|jpg|gif|png|webp|bmp|svg)$/i);
                        if (isImage) {
                            html += `<img src="${file}" alt="Görsel" class="message-image" />`;
                        } else {
                            html += `<div class="message-file">
                                <i class="fas fa-paperclip"></i>
                                <a href="${file}" target="_blank">${fileName}</a>
                            </div>`;
                        }
                    }

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error('Sohbet yüklenirken hata:', err);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorMsg.textContent = err.message || 'Sohbet yüklenirken bir hata oluştu.';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSharedConversation();
        });
    </script>

</body>
</html>
