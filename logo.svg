<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     width="1200"
     height="360"
     fill="none"
     role="img"
     aria-labelledby="title desc">

  <title id="title">AETHRION — Intelligence Without Limits.</title>
  <desc id="desc">
    AETHRION global technology brand identity.
  </desc>

  <defs>

    <!-- =====================================================
         AETHRION SIGNATURE GRADIENT
         ===================================================== -->

    <linearGradient id="aethrionSignature"
                    x1="30"
                    y1="30"
                    x2="330"
                    y2="330"
                    gradientUnits="userSpaceOnUse">

      <stop offset="0%"   stop-color="#A98BFF"/>
      <stop offset="32%"  stop-color="#705BFF"/>
      <stop offset="65%"  stop-color="#318CFF"/>
      <stop offset="100%" stop-color="#00E1D0"/>

    </linearGradient>


    <!-- Metallic wordmark -->

    <linearGradient id="aethrionText"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="100%">

      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#E7EDF8"/>
      <stop offset="100%" stop-color="#9CAEC7"/>

    </linearGradient>


    <!-- Central light -->

    <radialGradient id="aethrionCore"
                    cx="50%"
                    cy="50%"
                    r="50%">

      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="25%"  stop-color="#DFFFFF"/>
      <stop offset="55%"  stop-color="#62EFFF"/>
      <stop offset="100%" stop-color="#4C70FF"/>

    </radialGradient>


    <!-- Soft atmospheric glow -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="6"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Core glow -->

    <filter id="coreGlow"
            x="-400%"
            y="-400%"
            width="800%"
            height="800%">

      <feGaussianBlur
        stdDeviation="9"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- =====================================================
       AETHRION EMBLEM
       ===================================================== -->

  <g transform="translate(32 32)">

    <!--
      PRIMARY SILHOUETTE

      The outer form is intentionally neither a circle
      nor a conventional infinity symbol.

      It creates the impression of an AETHRION "portal".
    -->

    <path
      d="
        M148 8

        C93 17 47 48 22 95
        C-5 145 -3 203 23 252
        C49 301 95 332 148 342

        C202 332 248 301 274 252
        C300 203 302 145 275 95
        C250 48 204 17 148 8

        M148 42

        C112 49 81 71 63 102
        C44 135 41 174 52 210
        C64 248 91 277 127 293

        C140 299 154 299 168 293

        C204 277 231 248 243 210
        C254 174 251 135 232 102
        C214 71 183 49 148 42
      "

      fill="url(#aethrionSignature)"
      fill-rule="evenodd"
      stroke="none"/>


    <!-- =================================================
         NEGATIVE-SPACE A
         ================================================= -->

    <path
      d="
        M148 59

        L225 275

        L195 275

        L178 226

        L118 226

        L101 275

        L71 275

        Z

        M148 112

        L130 190

        L166 190

        Z
      "

      fill="#FFFFFF"
      fill-rule="evenodd"
      opacity="0.96"/>


    <!-- =================================================
         INFINITY / FLOW BRIDGE
         ================================================= -->

    <path
      d="
        M76 204

        C98 185 121 176 148 176

        C175 176 198 185 220 204
      "

      fill="none"
      stroke="url(#aethrionSignature)"
      stroke-width="13"
      stroke-linecap="round"/>


    <!-- =================================================
         CENTRAL AETHRION CORE
         ================================================= -->

    <circle
      cx="148"
      cy="176"
      r="14"
      fill="url(#aethrionCore)"
      filter="url(#coreGlow)"/>


    <circle
      cx="148"
      cy="176"
      r="4"
      fill="#FFFFFF"/>


    <!-- =================================================
         SIGNATURE ENERGY CUTS
         ================================================= -->

    <path
      d="
        M30 112
        L69 137
      "
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.9"/>


    <path
      d="
        M227 215
        L266 240
      "
      stroke="#FFFFFF"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.55"/>


    <!-- =================================================
         MICRO ENERGY POINTS
         ================================================= -->

    <circle
      cx="148"
      cy="43"
      r="3.5"
      fill="#FFFFFF"/>

    <circle
      cx="148"
      cy="309"
      r="3.5"
      fill="#65F1FF"/>

  </g>


  <!-- =====================================================
       AETHRION WORDMARK
       ===================================================== -->

  <g transform="translate(370 92)">

    <text
      x="0"
      y="82"
      font-family="Inter, Montserrat, Poppins, Arial, Helvetica, sans-serif"
      font-size="76"
      font-weight="800"
      letter-spacing="7"
      fill="url(#aethrionText)">

      AETHRION

    </text>


    <!-- Elegant signature underline -->

    <path
      d="
        M3 108
        C72 108 139 108 211 108
      "
      stroke="url(#aethrionSignature)"
      stroke-width="3.5"
      stroke-linecap="round"/>


    <!-- =================================================
         SLOGAN
         ================================================= -->

    <text
      x="3"
      y="143"
      font-family="Inter, Montserrat, Poppins, Arial, Helvetica, sans-serif"
      font-size="19"
      font-weight="500"
      letter-spacing="4.2"
      fill="#AAB9CE">

      INTELLIGENCE WITHOUT LIMITS.

    </text>


    <!-- Tiny brand signature -->

    <text
      x="5"
      y="171"
      font-family="Inter, Montserrat, Poppins, Arial, Helvetica, sans-serif"
      font-size="9"
      font-weight="700"
      letter-spacing="4"
      fill="#586B87">

      GLOBAL TECHNOLOGY • AI • CREATION • INNOVATION

    </text>

  </g>

</svg>
