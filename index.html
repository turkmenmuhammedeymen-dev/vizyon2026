<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
}

body {
    background: #050a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: #fff;
}

/* ===== ANA ARKA PLAN — KROM DALGA ===== */
.bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(0, 212, 255, 0.55), transparent 60%),
        radial-gradient(ellipse 70% 70% at 80% 80%, rgba(0, 255, 136, 0.45), transparent 60%),
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(0, 180, 220, 0.35), transparent 70%),
        linear-gradient(135deg, #001a2e 0%, #002a3a 30%, #00c8b4 60%, #00d4ff 100%);
    background-size: 200% 200%;
    animation: bgShift 12s ease-in-out infinite alternate;
    z-index: 1;
}

@keyframes bgShift {
    0%   { background-position: 0% 0%, 100% 100%, 50% 50%, 0% 0%; }
    100% { background-position: 100% 100%, 0% 0%, 50% 50%, 100% 100%; }
}

/* ===== KROM YANSIMA KATMANI ===== */
.chrome {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(115deg,
            transparent 0%,
            transparent 30%,
            rgba(255, 255, 255, 0.15) 45%,
            rgba(255, 255, 255, 0.5) 50%,
            rgba(255, 255, 255, 0.15) 55%,
            transparent 70%,
            transparent 100%);
    background-size: 300% 300%;
    animation: chromeSweep 6s ease-in-out infinite;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 2;
}

@keyframes chromeSweep {
    0%   { background-position: -100% 0; }
    100% { background-position: 200% 0; }
}

/* ===== IŞIK PARÇACIKLARI ===== */
.particles {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
}

.particle {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 12px #fff, 0 0 24px #00d4ff;
    animation: floatParticle linear infinite;
}

@keyframes floatParticle {
    0%   { transform: translateY(110vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* ===== İÇERİK KUTUSU ===== */
.container {
    position: relative;
    z-index: 10;
    max-width: 800px;
    padding: 40px;
    text-align: center;
    animation: fadeUp 1.2s ease forwards;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ===== LOGO ===== */
.logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: radial-gradient(circle, #00d4ff 0%, #00ff88 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    box-shadow: 0 0 60px rgba(0, 212, 255, 0.9), 0 0 120px rgba(0, 255, 136, 0.5);
    animation: logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(0, 212, 255, 0.9), 0 0 120px rgba(0, 255, 136, 0.5); }
    50%      { transform: scale(1.08); box-shadow: 0 0 100px rgba(0, 212, 255, 1), 0 0 180px rgba(0, 255, 136, 0.8); }
}

/* ===== BAŞLIK ===== */
h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(48px, 8vw, 100px);
    font-weight: 800;
    color: #000;
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 20px;
    text-shadow:
        0 0 40px rgba(255, 255, 255, 0.9),
        0 0 80px rgba(0, 212, 255, 0.6),
        2px 2px 0 rgba(0, 0, 0, 0.3);
    animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    0%   { text-shadow: 0 0 40px rgba(255,255,255,0.9), 0 0 80px rgba(0,212,255,0.6), 2px 2px 0 rgba(0,0,0,0.3); }
    100% { text-shadow: 0 0 60px rgba(255,255,255,1), 0 0 120px rgba(0,255,136,0.9), 2px 2px 0 rgba(0,0,0,0.3); }
}

/* ===== ALT BAŞLIK ===== */
.subtitle {
    font-family: 'Syne', sans-serif;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 700;
    color: #000;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 40px;
    opacity: 0.85;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
}

/* ===== MESAJ KUTUSU ===== */
.message {
    background: rgba(0, 0, 0, 0.75);
    border: 2px solid rgba(0, 255, 136, 0.4);
    border-radius: 20px;
    padding: 30px 40px;
    margin: 0 auto 40px;
    max-width: 600px;
    backdrop-filter: blur(10px);
    box-shadow:

        inset 0 0 40px rgba(0, 255, 136, 0.05);
}

.message p {
    font-size: 17px;

    color: #e0f7ff;
    margin-bottom: 12px;
}

.message p:last-child { margin-bottom: 0; }

.message strong {
    color: #00ff88;
    font-weight: 700;
}

/* ===== LOADER ÇUBUĞU ===== */
.loader {
    width: 280px;
    max-width: 80%;
    height: 5px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 10px;
    margin: 0 auto;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
}

.loader-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #00d4ff, #00ff88, #00d4ff);
    background-size: 200% 100%;
    border-radius: 10px;
    animation: loadMove 2s ease-in-out infinite;
    box-shadow: 0 0 20px #00ff88;
}

@keyframes loadMove {
    0%   { width: 0%; background-position: 0% 50%; }
    50%  { width: 70%; background-position: 100% 50%; }
    100% { width: 100%; background-position: 0% 50%; }
}

/* ===== SÜRÜM ===== */
.version {
    position: fixed;
    bottom: 25px;

    font-size: 12px;

    letter-spacing: 2px;

}

/* ===== MOBİL ===== */

    .container { padding: 20px; }

    .message p { font-size: 14px; }
    .subtitle { letter-spacing: 2px; }
    .version { bottom: 15px; right: 15px; font-size: 10px; }

</style>
